<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="bg2" cx="65%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1e1834"/>
      <stop offset="55%" stop-color="#0f0a1f"/>
      <stop offset="100%" stop-color="#050309"/>
    </radialGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="dot" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(168,85,247,0.18)"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <rect width="1200" height="750" fill="url(#dot)"/>

  <!-- Python brackets vibe -->
  <g opacity="0.45" stroke="rgba(168,85,247,0.55)" stroke-width="2" fill="none">
    <path d="M 200 280 L 100 380 L 200 480"/>
    <path d="M 1000 280 L 1100 380 L 1000 480"/>
  </g>
  <g opacity="0.5">
    <text x="370" y="400" font-family="'JetBrains Mono', monospace" font-size="22" fill="rgba(232,121,249,0.8)">def innovate():</text>
    <text x="420" y="440" font-family="'JetBrains Mono', monospace" font-size="22" fill="rgba(168,85,247,0.85)">return data + AI</text>
  </g>

  <!-- Brand -->
  <g transform="translate(80,90)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#accent2)"/>
    <text x="28" y="38" text-anchor="middle" font-family="'Geist', sans-serif" font-weight="800" font-size="22" fill="#0f0a1f">SIC</text>
  </g>
  <text x="155" y="115" font-family="'Geist', sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.55)" letter-spacing="2">PROJECT · 06</text>
  <text x="155" y="142" font-family="'Geist', sans-serif" font-size="14" font-weight="400" fill="rgba(232,121,249,0.85)" letter-spacing="3">PYTHON · DATA · ANALYTICS</text>

  <text x="80" y="600" font-family="'Geist', sans-serif" font-size="120" font-weight="700" fill="white" letter-spacing="-6">Innovation Campus</text>
  <text x="84" y="640" font-family="'Geist', sans-serif" font-size="18" font-weight="500" fill="rgba(255,255,255,0.7)" letter-spacing="1.5">Samsung Innovation Campus · Python Track Capstone</text>

  <text x="1120" y="115" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">SIC · 2025</text>
</svg>
