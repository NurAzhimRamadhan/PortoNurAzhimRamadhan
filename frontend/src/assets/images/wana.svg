<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="bg" cx="35%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a2e1f"/>
      <stop offset="55%" stop-color="#0d1b12"/>
      <stop offset="100%" stop-color="#050905"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(132,204,22,0.10)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- Abstract forest / topographic lines -->
  <g stroke="rgba(132,204,22,0.35)" fill="none" stroke-width="1.5">
    <path d="M -40 540 C 220 480 360 600 540 540 S 880 460 1240 520"/>
    <path d="M -40 600 C 220 550 360 660 540 600 S 880 530 1240 580"/>
    <path d="M -40 660 C 220 620 360 720 540 660 S 880 600 1240 640"/>
    <path d="M -40 720 C 220 690 360 770 540 720 S 880 670 1240 700"/>
  </g>

  <!-- Network / governance nodes -->
  <g filter="url(#glow)">
    <circle cx="240" cy="220" r="6" fill="#84cc16"/>
    <circle cx="420" cy="170" r="4" fill="#10b981"/>
    <circle cx="600" cy="260" r="8" fill="#06b6d4"/>
    <circle cx="780" cy="170" r="4" fill="#84cc16"/>
    <circle cx="960" cy="240" r="6" fill="#10b981"/>
    <circle cx="320" cy="340" r="4" fill="#06b6d4"/>
    <circle cx="500" cy="380" r="5" fill="#84cc16"/>
    <circle cx="700" cy="360" r="4" fill="#10b981"/>
    <circle cx="870" cy="380" r="5" fill="#06b6d4"/>
  </g>
  <g stroke="rgba(132,204,22,0.5)" stroke-width="1" fill="none">
    <line x1="240" y1="220" x2="420" y2="170"/>
    <line x1="420" y1="170" x2="600" y2="260"/>
    <line x1="600" y1="260" x2="780" y2="170"/>
    <line x1="780" y1="170" x2="960" y2="240"/>
    <line x1="240" y1="220" x2="320" y2="340"/>
    <line x1="600" y1="260" x2="500" y2="380"/>
    <line x1="600" y1="260" x2="700" y2="360"/>
    <line x1="960" y1="240" x2="870" y2="380"/>
    <line x1="500" y1="380" x2="700" y2="360"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(80,90)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#accent)" filter="url(#glow)" opacity="0.95"/>
    <path d="M 16 38 L 28 14 L 40 38 Z" fill="#0d1b12"/>
    <circle cx="28" cy="40" r="3" fill="#0d1b12"/>
  </g>
  <text x="155" y="115" font-family="'Geist', sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.55)" letter-spacing="2">PROJECT · 01</text>
  <text x="155" y="142" font-family="'Geist', sans-serif" font-size="14" font-weight="400" fill="rgba(132,204,22,0.85)" letter-spacing="3">INDIGENOUS · DIGITAL · RIGHTS</text>

  <!-- WANA title -->
  <text x="80" y="500" font-family="'Geist', sans-serif" font-size="180" font-weight="700" fill="white" letter-spacing="-8">WANA</text>
  <text x="84" y="540" font-family="'Geist', sans-serif" font-size="18" font-weight="500" fill="rgba(255,255,255,0.7)" letter-spacing="1.5">Wilayah Adat Nusantara Accountability</text>

  <!-- Tagline strip -->
  <rect x="80" y="600" width="640" height="48" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(132,204,22,0.25)"/>
  <text x="100" y="630" font-family="'JetBrains Mono', monospace" font-size="13" fill="rgba(255,255,255,0.85)" letter-spacing="1.2">
    AI POLICY INTELLIGENCE · SPATIAL OVERLAY · SDG 16 · 15 · 17
  </text>

  <!-- Corner metadata -->
  <text x="1120" y="115" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">PRISMATIC · 2026</text>
  <text x="1120" y="135" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">FLAGSHIP</text>
</svg>
